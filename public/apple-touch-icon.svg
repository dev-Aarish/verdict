<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <filter id="grain" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <mask id="clap-stripes" maskUnits="userSpaceOnUse">
      <rect x="12" y="26" width="40" height="30" fill="#fff"/>
      <rect x="8.5" y="-4" width="7" height="60" fill="#000" transform="rotate(45 12 26)"/>
      <rect x="18.5" y="3.5" width="7" height="60" fill="#000" transform="rotate(45 22 33.5)"/>
      <rect x="28.5" y="11" width="7" height="60" fill="#000" transform="rotate(45 32 41)"/>
      <rect x="38.5" y="18.5" width="7" height="60" fill="#000" transform="rotate(45 42 48.5)"/>
      <rect x="48.5" y="26" width="7" height="60" fill="#000" transform="rotate(45 52 56)"/>
    </mask>
  </defs>
  <rect width="180" height="180" fill="#14151D"/>
  <g transform="translate(90 90) scale(3) translate(-32 -32) rotate(-3 32 32)" fill="#C9A03C" stroke="none" filter="url(#grain)">
    <rect x="12" y="16" width="40" height="7" rx="1.5"/>
    <circle cx="13" cy="19.5" r="2.5"/>
    <rect x="12" y="26" width="40" height="30" rx="2" mask="url(#clap-stripes)"/>
  </g>
</svg>
